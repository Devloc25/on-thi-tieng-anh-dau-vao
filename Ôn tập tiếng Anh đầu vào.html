function defs(e){const d=[];
 e.mcq.forEach((x,i)=>d.push({k:"m"+i,p:1,t:"c",a:x.a}));
 if(e.cloze)e.cloze.items.forEach((x,i)=>d.push({k:"c"+i,p:2,t:"c",a:x.a}));
 e.tf.forEach((x,i)=>d.push({k:"t"+i,p:2,t:"b",a:x.a}));
 e.rmc.forEach((x,i)=>d.push({k:"r"+i,p:2,t:"c",a:x.a}));
 e.short.forEach((x,i)=>d.push({k:"s"+i,p:2,t:"x",al:x.al,sh:1}));
 ["arr","err","qf"].forEach(n=>e[n].forEach((x,i)=>d.push({k:n[0]+i,p:3,t:"x",al:x.al})));
 return d}
function ok(d){if(d.t==="x")return manual[d.k]!==undefined?manual[d.k]:!!chk[d.k];return ans[d.k]===d.a}
function score(e){const D=defs(e),P={1:[0,0],2:[0,0],3:[0,0]},w={1:4,2:3,3:3},r={};let t=0;
 D.forEach(d=>{P[d.p][1]++;if(ok(d))P[d.p][0]++});
 for(const p in P){r[p]=P[p][0]/P[p][1]*w[p];t+=r[p]}return{P,r,t}}
